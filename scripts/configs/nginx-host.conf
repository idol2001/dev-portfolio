# ============================================================
# Dev Portfolio — 宿主机 Nginx 配置
# 用法: sudo cp nginx-host.conf /etc/nginx/sites-available/dev-portfolio
#       sudo ln -s /etc/nginx/sites-available/dev-portfolio /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# HTTP → HTTPS 重定向（取消注释后启用）
# server {
#     listen 80;
#     server_name jacoblee.info www.jacoblee.info;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name jacoblee.info www.jacoblee.info;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # 前端静态文件
    root /opt/portfolio/web;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # 后端 API 反向代理
    location /dev-portfolio {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（文件上传可能需要更长时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 不缓存 API 响应
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 访问日志（按需开启）
    # access_log /var/log/nginx/dev-portfolio-access.log;
    # error_log /var/log/nginx/dev-portfolio-error.log warn;
}
