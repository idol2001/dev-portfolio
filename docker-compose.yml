version: '3.8'

# ============================================================
# dev-portfolio Docker Compose
# 部署说明: 见 DEPLOY.md
# 默认使用 SQLite，无需外部数据库。如需 MySQL，修改 dev-portfolio-api/.env 中的 DB_TYPE=mysql
# ============================================================

services:
  api:
    build:
      context: ./dev-portfolio-api
      dockerfile: Dockerfile
    container_name: dev-portfolio-api
    restart: always
    # 从 .env 文件加载环境变量
    env_file:
      - ./dev-portfolio-api/.env
    # 不再暴露 8080 端口到公网，仅通过 Docker 内部网络通信
    # ports:
    #   - "${API_PORT:-8080}:8080"
    volumes:
      - api-data:/root/data         # SQLite 数据库文件持久化
      - api-uploads:/root/uploads   # 本地上传文件持久化（未启用 OSS 时）
      - api-logs:/root/logs         # 日志持久化
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dev-portfolio-network

  web:
    build:
      context: ./dev-portfolio-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/dev-portfolio}
    container_name: dev-portfolio-web
    restart: always
    ports:
      # 仅绑定到 127.0.0.1，防止外网直接访问容器，强制走主机 Nginx
      - "127.0.0.1:3000:80"
    depends_on:
      - api
    networks:
      - dev-portfolio-network

volumes:
  api-data:       # SQLite 数据库 (data/portfolio.db)
  api-uploads:    # 本地上传文件
  api-logs:       # 应用日志

networks:
  dev-portfolio-network:
    driver: bridge
